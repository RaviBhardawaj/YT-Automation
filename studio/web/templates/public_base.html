<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf }}">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="Create, edit and publish YouTube videos and Shorts with AI — in Hindi, Hinglish or English. Free during beta.">
  <link rel="stylesheet" href="/static/app.css?v={{ static_v }}">
</head>
<body>
<header class="pub-head">
  <a class="brand" href="/home" style="padding:0;color:inherit;text-decoration:none"><div class="logo">▶</div><div>{{ site_name }}</div></a>
  <nav class="row">
    <a href="/home#how">How it works</a><a href="/pricing">Pricing</a>
    {% if me %}<a class="btn primary" href="/">Open my studio</a>{% else %}<a href="/login">Sign in</a><a class="btn primary" href="/signup">Create free account</a>{% endif %}
  </nav>
</header>
<main class="pub-main">{% block content %}{% endblock %}</main>
<footer class="pub-foot">
  <span>© {{ year }} {{ site_name }}</span>
  <span class="row"><a href="/pricing">Pricing</a><a href="/privacy">Privacy policy</a><a href="/terms">Terms of use</a>{% if contact %}<a href="mailto:{{ contact }}">Contact</a>{% endif %}</span>
</footer>
<script src="/static/app.js?v={{ static_v }}"></script>
</body>
</html>
